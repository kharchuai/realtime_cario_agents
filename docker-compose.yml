# =============================================================
# docker-compose.yml — Hạ tầng cho hệ thống xử lý dữ liệu y tế
# realtime (Medical Realtime System)
#
# File này dựng và kết nối 3 service chính:
#
# 1. postgres      : Database chính (PostgreSQL 15), lưu trữ dữ liệu
#                     y tế. Tự động chạy các file .sql trong thư mục
#                     ./db khi container được tạo lần đầu để khởi
#                     tạo schema.
#
# 2. zookeeper      : Service coordination bắt buộc cho Kafka
#                     (quản lý metadata, config của cluster).
#
# 3. kafka          : Message broker, nhận và phân phối dữ liệu
#                     y tế theo thời gian thực giữa các service
#                     (producer/consumer). Truy cập nội bộ qua
#                     kafka:29092, truy cập từ máy host qua
#                     localhost:9092.
#
# Dữ liệu của postgres và kafka được lưu bền vững qua Docker
# volumes (pg_data, kafka_data) để không bị mất khi container
# bị xoá hoặc restart.
# =============================================================
services:
    postgres:
        image: postgres:15
        container_name: medical_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1504}
            POSTGRES_DB: ${POSTGRES_DB:-medical_realtime}
        ports:
            - "5433:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
            # Automatic run file schema.sql when create database first time
            - ./db:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medical_realtime}"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period:  10s
        restart: unless-stopped

    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        container_name: medical_zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
        volumes:
            - zookeeper_data:/var/lib/zookeeper/data
        healthcheck:
            test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
            interval: 5s
            timeout: 10s
            retries: 12
            start_period: 10s
        restart: unless-stopped

    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: medical_kafka
        volumes:
            - kafka_data:/var/lib/kafka/data
        depends_on:
            - zookeeper
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

             # Topic phải được tạo bởi kafka-init, tránh phụ thuộc auto-create.
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

        healthcheck:
            test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
            interval: 5s
            timeout: 10s
            retries: 20
            start_period: 20s
        restart: unless-stopped

    kafka-init:
        image: confluentinc/cp-kafka:7.5.0
        container_name: medical_kafka_init
        depends_on:
            kafka:
                condition: service_healthy

        command:
            - /bin/bash
            - -ec
            - |
                kafka-topics \
                    --bootstrap-server kafka:29092 \
                    --create \
                    --if-not-exists \
                    --topic "${KAFKA_TOPIC_VITALS:-patient_vitals_stream}"\
                    --partitions "${KAFKA_TOPIC_PARTITIONS:-3}"\
                    --replication-factor 1

                kafka-topics \
                    --bootstrap-server kafka:29092 \
                    --describe \
                    --topic "${KAFKA_TOPIC_VITALS:-patient_vitals_stream}"
        restart:  "no"

    consumer:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: medical_consumer
        env_file:
            - .env
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            KAFKA_BROKER_URL: kafka:29092
            KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS:-patient_vitals_stream}
        depends_on:
            postgres:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    python -c "import os,socket;
                    p=socket.create_connection((os.environ['POSTGRES_HOST'],int(os.environ['POSTGRES_PORT'])),3);
                    p.close();
                    h,q=os.environ['KAFKA_BROKER_URL'].rsplit(':',1);
                    k=socket.create_connection((h,int(q)),3);
                    k.close()"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart:  unless-stopped


volumes:
    pg_data:
    kafka_data:
    zookeeper_data:
    zookeeper_log:
